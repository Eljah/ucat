name: Java Maven CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build project
        run: mvn -B -ntp clean package
      - name: Run smoke test with assertions
        run: |
          java -ea -cp target/classes:target/test-classes ru.activisthelp.SmokeTest
          java -ea -cp target/classes:target/test-classes ru.activisthelp.RoadSourcesTest
